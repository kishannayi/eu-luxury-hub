<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000">
<meta name="robots" content="noindex,nofollow">
<title>EU Luxury Hub — Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#000;--surf:#0c0c0c;--surf-2:#141414;--border:#1a1a1a;--border-2:#262626;--t1:#fff;--t2:#c4c4c4;--t3:#7a7a7a;--t4:#4a4a4a;--acid:#d6ff00;--acid-2:#b8e600;--acid-glow:rgba(214,255,0,.6);--acid-soft:rgba(214,255,0,.08);--red:#ff2a2a;--green:#00d97a;--ease:cubic-bezier(.22,.61,.36,1);--ease-out:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
*::selection{background:var(--acid);color:#000}
html,body{background:#000;height:100%}
body{font-family:'Space Grotesk',sans-serif;font-size:14px;line-height:1.5;color:#fff;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
img,svg{display:block;max-width:100%}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:#000}
*::-webkit-scrollbar-thumb{background:var(--border-2);border:2px solid #000}
*::-webkit-scrollbar-thumb:hover{background:var(--acid)}

/* SELECTS — fix Linux/Chrome white dropdowns */
select,select option,.statussel,.statussel option{background-color:#0a0a0a!important;color:#fff!important;color-scheme:dark}
select:focus,.statussel:focus{outline:1px solid var(--acid);outline-offset:-1px}

/* FORM */
.fld{margin-bottom:14px;position:relative}
.fld label{position:absolute;top:-7px;left:14px;font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--t3);background:#000;padding:0 7px;z-index:1;font-weight:500}
.fld input{width:100%;padding:16px;background:#0a0a0a;border:1px solid var(--border);color:#fff;font-family:'Space Grotesk';font-size:14px;transition:.25s}
.fld input:focus{outline:none;border-color:var(--acid);background:#0d0d0d}
.fld input::placeholder{color:var(--t4)}
.fld2{margin-bottom:0;position:relative}
.fld2 label{display:block;font-family:'JetBrains Mono';font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--t3);margin-bottom:9px;font-weight:600}
.fld2 input,.fld2 textarea,.fld2 select{width:100%;padding:13px 15px;border:1px solid var(--border-2);background:#0a0a0a;font-family:'Space Grotesk';font-size:13.5px;color:#fff;transition:.25s}
.fld2 input:focus,.fld2 textarea:focus,.fld2 select:focus{outline:none;border-color:var(--acid)}
.fld2 textarea{resize:vertical;min-height:58px}

/* BUTTONS */
.btn-acid{display:inline-flex;align-items:center;justify-content:center;gap:14px;padding:18px 30px;background:var(--acid);color:#000;font-family:'JetBrains Mono';font-weight:700;font-size:11px;letter-spacing:3px;text-transform:uppercase;position:relative;overflow:hidden;transition:.45s var(--ease);width:100%;border:1px solid var(--acid)}
.btn-acid::before{content:"";position:absolute;inset:0;background:#fff;transform:translateY(101%);transition:.45s var(--ease)}
.btn-acid:hover::before{transform:none}
.btn-acid span,.btn-acid svg{position:relative;z-index:1}
.btn-acid svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .4s var(--ease)}
.btn-acid:hover svg{transform:translateX(6px)}
.btn-mini{font-family:'JetBrains Mono';font-size:10px;letter-spacing:2.5px;text-transform:uppercase;padding:8px 14px;border:1px solid var(--border-2);background:transparent;color:#fff;transition:.25s;font-weight:600}
.btn-mini:hover{background:var(--acid);color:#000;border-color:var(--acid)}
.btn-mini.danger{border-color:var(--red);color:var(--red)}
.btn-mini.danger:hover{background:var(--red);color:#fff}
.btn-prime{font-family:'JetBrains Mono';font-size:11px;letter-spacing:3px;text-transform:uppercase;padding:13px 22px;border:1px solid var(--acid);background:var(--acid);color:#000;transition:.3s;font-weight:700;display:inline-flex;align-items:center;gap:10px}
.btn-prime:hover{background:#fff;border-color:#fff}
.btn-prime svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* ADMIN LOGIN */
.adlogin{position:fixed;inset:0;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;padding:30px;z-index:2}
.adlogin.gone{display:none}
.adl-card{width:100%;max-width:440px}
.adl-eye{font-family:'JetBrains Mono';font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--acid);margin-bottom:18px;display:flex;align-items:center;gap:14px;font-weight:600}
.adl-eye::before{content:"";width:30px;height:1px;background:var(--acid)}
.adl-card h2{font-family:'Bricolage Grotesque';font-weight:800;font-size:54px;line-height:.95;margin-bottom:16px;letter-spacing:-.04em}
.adl-card h2 em{color:var(--acid);font-style:italic;font-weight:700}
.adl-card p{font-size:13px;color:var(--t3);margin-bottom:28px}
.adl-card p b{color:var(--acid);font-weight:600}
.adl-otp{margin:6px 0 18px;padding:18px;border:1px dashed var(--acid);background:var(--acid-soft);text-align:center;cursor:pointer}
.adl-otp .l{font-family:'JetBrains Mono';font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--acid);margin-bottom:8px;font-weight:600}
.adl-otp .c{font-family:'JetBrains Mono';font-weight:700;font-size:36px;letter-spacing:.16em;color:var(--acid)}
.adl-back{display:inline-block;margin-top:16px;font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--acid);border-bottom:1px solid currentColor;font-weight:600}

/* ADMIN SHELL */
.admin-shell{display:grid;grid-template-columns:260px 1fr;height:100vh;background:#000}
.adside{background:#0a0a0a;color:#fff;padding:32px 0;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow-y:auto}
.adside .ab{padding:0 26px 30px;border-bottom:1px solid var(--border);margin-bottom:18px}
.adside .ab .name{font-family:'Bricolage Grotesque';font-weight:800;font-size:30px;line-height:1;letter-spacing:-.035em}
.adside .ab .name em{color:var(--acid);font-style:italic;font-weight:700}
.adside .ab .sub{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:3px;text-transform:uppercase;color:var(--acid);margin-top:6px;font-weight:600}
.adsec{padding:0 14px 8px;font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:3px;text-transform:uppercase;color:var(--t4);margin:14px 0 8px;font-weight:600}
.adnav button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 26px;font-family:'JetBrains Mono';font-size:11.5px;letter-spacing:2px;color:var(--t2);text-align:left;transition:.25s;border-left:2px solid transparent;font-weight:500;text-transform:uppercase}
.adnav button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5}
.adnav button:hover{color:#fff;background:rgba(255,255,255,.03)}
.adnav button.on{color:var(--acid);background:var(--acid-soft);border-left-color:var(--acid)}
.adside .foot{margin-top:auto;padding:24px 26px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.adside .foot a,.adside .foot button{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--t2);display:flex;align-items:center;gap:10px;text-align:left;transition:.25s;font-weight:500;padding:0}
.adside .foot a:hover,.adside .foot button:hover{color:var(--acid)}
.admain{display:flex;flex-direction:column;overflow:hidden;background:#000}
.adtop{padding:22px 36px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:#0a0a0a}
.adtop h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:36px;line-height:1;letter-spacing:-.025em}
.adtop h1 em{color:var(--acid);font-style:italic;font-weight:700}
.adtop .crumb{font-family:'JetBrains Mono';font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--t3);margin-bottom:5px;font-weight:600}
.adtop .rt{display:flex;gap:12px;align-items:center}
.adcontent{flex:1;overflow-y:auto;padding:36px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:36px}
.stat{padding:28px;background:#0a0a0a;border:1px solid var(--border);position:relative;overflow:hidden;transition:.3s}
.stat:hover{border-color:var(--acid)}
.stat .l{font-family:'JetBrains Mono';font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--t3);margin-bottom:14px;font-weight:600}
.stat .n{font-family:'Bricolage Grotesque';font-weight:800;font-size:60px;line-height:.9;letter-spacing:-.04em;color:#fff}
.stat .n em{color:var(--acid);font-style:italic;font-weight:700}
.stat .d{font-family:'JetBrains Mono';font-size:10.5px;color:var(--green);margin-top:14px;letter-spacing:1.5px;font-weight:600;text-transform:uppercase}
.stat .d.warn{color:var(--red)}
.stat::after{content:"";position:absolute;bottom:0;left:0;height:2px;background:var(--acid);transform-origin:left;transform:scaleX(0);transition:.5s var(--ease)}
.stat:hover::after{transform:scaleX(1)}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.stats{grid-template-columns:1fr}}
.panel{background:#0a0a0a;border:1px solid var(--border);margin-bottom:26px}
.panel-h{padding:20px 26px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.panel-h h3{font-family:'Bricolage Grotesque';font-weight:800;font-size:24px;line-height:1;letter-spacing:-.025em}
.panel-h h3 em{color:var(--acid);font-style:italic}
.panel-h .ct{font-family:'JetBrains Mono';font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--t3);font-weight:600}
table.t{width:100%;border-collapse:collapse;font-family:'Space Grotesk';font-size:13px}
table.t th{text-align:left;padding:14px 26px;font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--border);font-weight:600}
table.t td{padding:16px 26px;border-bottom:1px solid var(--border);color:#fff;vertical-align:middle}
table.t tr:hover td{background:rgba(255,255,255,.02)}
table.t .nm{font-family:'Bricolage Grotesque';font-size:16px;font-weight:800;letter-spacing:-.02em}
table.t .mut{color:var(--t3);font-size:11.5px;font-family:'JetBrains Mono';letter-spacing:1px}
.statusp{display:inline-flex;align-items:center;padding:5px 11px;font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:2px;text-transform:uppercase;font-weight:700;border:1px solid currentColor}
.s-Processing{color:var(--acid)}.s-Shipped{color:#7ad6ff}.s-Delivered{color:var(--green)}.s-Cancelled{color:var(--red)}
.statussel{font-family:'JetBrains Mono';font-size:11px;padding:6px 8px;border:1px solid var(--border-2);background:transparent;letter-spacing:1px;text-transform:uppercase;font-weight:600;color:#fff}
.adgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.adp{background:#0a0a0a;border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;transition:.3s}
.adp:hover{border-color:var(--acid);transform:translateY(-3px)}
.adp .th{aspect-ratio:1;background:linear-gradient(180deg,#181818,#0a0a0a);display:flex;align-items:center;justify-content:center;position:relative}
.adp .th svg{width:55%;height:55%;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.adp .th .t{position:absolute;top:10px;right:10px;font-family:'JetBrains Mono';font-size:9px;letter-spacing:2px;padding:4px 8px;background:#fff;color:#000;font-weight:700;text-transform:uppercase}
.adp .t.HOT{background:var(--acid)}.adp .t.NEW{background:#fff}.adp .t.SALE{background:var(--red);color:#fff}
.adp .b{padding:14px;display:flex;flex-direction:column;gap:6px}
.adp .br{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--acid);font-weight:600}
.adp .nm{font-family:'Bricolage Grotesque';font-weight:800;font-size:18px;line-height:1.1;letter-spacing:-.02em}
.adp .pr{font-family:'JetBrains Mono';font-size:11.5px;color:#fff;font-weight:600;letter-spacing:1px}
.adp .pr em{color:var(--acid);font-style:normal;font-weight:700}
.adp .ac{display:flex;gap:6px;margin-top:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.form-grid .full{grid-column:1/-1}
.imgslot{display:flex;flex-direction:column;gap:6px}
.imgprev{position:relative;aspect-ratio:1;border:1px dashed var(--border-2);background:#0a0a0a;display:flex;align-items:center;justify-content:center;overflow:hidden}
.imgprev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.imgph{font-family:'JetBrains Mono';font-size:9px;letter-spacing:1.5px;color:var(--t3);text-align:center;font-weight:600}
.imgx{position:absolute;top:4px;right:4px;width:22px;height:22px;background:rgba(0,0,0,.85);color:#fff;border:1px solid var(--red);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;z-index:2}
.imgx:hover{background:var(--red)}

/* Size & Color click selectors */
.pickerGrid{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid var(--border);background:#0a0a0a}
.pickChip{padding:9px 14px;border:1px solid var(--border-2);background:transparent;color:var(--t2);font-family:'JetBrains Mono';font-size:11px;letter-spacing:1.5px;font-weight:600;cursor:pointer;transition:all .15s;min-width:42px;text-align:center}
.pickChip:hover{border-color:var(--t2);color:#fff}
.pickChip.on{background:var(--acid);border-color:var(--acid);color:#000}
.colorChip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--border-2);background:transparent;color:var(--t2);font-family:'Space Grotesk';font-size:12px;cursor:pointer;transition:all .15s;font-weight:500}
.colorChip:hover{border-color:var(--t2);color:#fff}
.colorChip.on{border-color:var(--acid);color:#fff;background:#1a1a0a}
.colorChip .swatch{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.2);flex:none}
.colorChip.on .swatch{box-shadow:0 0 0 2px var(--acid)}
.pickInfo{font-family:'JetBrains Mono';font-size:9.5px;color:var(--t3);letter-spacing:1.5px;margin-top:6px;text-transform:uppercase;font-weight:600}
.aiBtn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:linear-gradient(135deg,#d6ff00 0%,#a3cc00 100%);color:#000;font-family:'JetBrains Mono';font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;border:none;cursor:pointer;transition:transform .2s;width:100%;justify-content:center;margin-top:6px}
.aiBtn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(214,255,0,.3)}
.aiBtn:disabled{opacity:.5;cursor:wait;transform:none}
.ad-burger{display:none}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:980px){
  .admin-shell{grid-template-columns:1fr}
  .adside{position:absolute;top:0;left:-100%;width:280px;height:100%;transition:.4s;z-index:5}
  .adside.open{left:0}
  .adcontent{padding:22px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
  .ad-burger{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid var(--border-2);color:#fff}
  .adl-card h2{font-size:42px}
  /* Profit calc grid: 4 cols → 2 cols on tablet */
  .profitGrid{grid-template-columns:1fr 1fr!important}
  /* 5-image grid: 5 → 3 on tablet */
  .imgGrid5{grid-template-columns:repeat(3,1fr)!important}
}
@media(max-width:640px){
  .adcontent{padding:14px 12px}
  .stats{grid-template-columns:1fr}
  .panel-h{padding:14px 16px;flex-wrap:wrap;gap:8px}
  .panel-h h3{font-size:18px}
  /* Profit grid: stack vertically */
  .profitGrid{grid-template-columns:1fr!important;gap:10px!important}
  /* 5-image grid: 3 → 2 on phone */
  .imgGrid5{grid-template-columns:repeat(2,1fr)!important}
  /* Form padding less */
  form.form-grid{padding:14px!important}
  /* Tables scroll horizontally */
  .t{font-size:11px}
  .panel{overflow-x:auto}
  /* Login card */
  .adl-card{padding:24px 18px}
  .adl-card h2{font-size:32px;letter-spacing:-.02em}
  .adl-eye{font-size:9px;letter-spacing:2px}
  /* Picker grids on mobile */
  .pickerGrid{padding:6px;gap:5px}
  .pickChip{padding:8px 10px;font-size:10.5px;min-width:38px}
  .colorChip{font-size:11px;padding:6px 9px}
  .colorChip .swatch{width:14px;height:14px}
  /* Profit boxes shrink */
  .profitBox .v{font-size:18px!important}
  /* AI button bigger touch target */
  .aiBtn{padding:12px 16px;font-size:11.5px}
  /* Admin top bar wraps */
  .adtop{padding:14px 16px;flex-wrap:wrap;gap:10px}
  /* Sidebar nav items wider touch */
  .adnav a{padding:14px 18px}
}
@media(max-width:380px){
  /* Very small phones */
  .imgGrid5{grid-template-columns:1fr 1fr!important}
  .stats .stat .n{font-size:24px}
  .panel-h h3{font-size:16px}
}

/* TOAST */
#toasts{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{background:#000;color:#fff;padding:13px 22px;display:flex;align-items:center;gap:11px;font-family:'JetBrains Mono';font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:600;border:1px solid var(--acid);box-shadow:0 24px 50px -20px rgba(0,0,0,.8);animation:tin .4s var(--ease);max-width:90vw}
.toast svg{width:14px;height:14px;stroke:var(--acid);fill:none;stroke-width:2;flex:none}
@keyframes tin{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.toast.out{animation:tout .35s var(--ease) forwards}
@keyframes tout{to{opacity:0;transform:translateY(20px)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="adlogin" id="adLogin">
  <div class="adl-card">
    <div class="adl-eye"><span>Restricted · Admin Console</span></div>
    <h2>Atelier <em>Admin.</em></h2>
    <p id="adlMsg">Enter the admin password. Default: <b>euluxury2025</b></p>
    <form id="adLoginForm" onsubmit="adminLogin(event);return false;">
      <div class="fld" id="adPwdFld"><label>Password</label><input type="password" id="adPwd" placeholder="••••••••" autocomplete="current-password"></div>
      <div id="adOtpStep" style="display:none">
        <div class="adl-otp" onclick="document.getElementById('adOtp').value=document.getElementById('otpShown').textContent;document.getElementById('adOtp').focus();" title="Click to auto-fill"><div class="l">OTP — Tap to fill ↓</div><div class="c" id="otpShown">— — — —</div></div>
        <div class="fld"><label>Enter OTP</label><input type="text" id="adOtp" placeholder="4-digit" autocomplete="one-time-code"></div>
      </div>
      <button type="button" class="btn-acid" onclick="adminLogin(event)"><span id="adLoginBtn">Verify Password</span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
    <a href="/" class="adl-back">← Back to store</a>
  </div>
</div>

<!-- SHELL -->
<div class="admin-shell" id="adShell" style="display:none">
  <aside class="adside" id="adSide">
    <div class="ab"><div class="name">EU <em>Luxury.</em></div><div class="sub">Admin Console</div></div>
    <div class="adsec">Manage</div>
    <div class="adnav">
      <button data-t="dashboard" class="on" onclick="adTab('dashboard')"><svg viewBox="0 0 24 24"><path d="M3 12h7V3H3zM14 21h7v-9h-7zM14 10h7V3h-7zM3 21h7v-7H3z"/></svg>Dashboard</button>
      <button data-t="products" onclick="adTab('products')"><svg viewBox="0 0 24 24"><path d="M20 7 12 3 4 7v10l8 4 8-4Z"/><path d="m4 7 8 4 8-4M12 11v10"/></svg>Products</button>
      <button data-t="orders" onclick="adTab('orders')"><svg viewBox="0 0 24 24"><path d="M9 3h6l2 4H7Z"/><path d="M5 7h14v14H5Z"/><path d="M9 12h6"/></svg>Orders</button>
      <button data-t="promos" onclick="adTab('promos')"><svg viewBox="0 0 24 24"><path d="M3 12 12 3l9 9-9 9Z"/><circle cx="9" cy="9" r="1.5"/></svg>Promos</button>
    </div>
    <div class="adsec">Audience</div>

function renderDash(){
  const active=ORDERS.filter(o=>o.status!=='Cancelled');
  const rev=active.reduce((a,b)=>a+(parseFloat(b.total)||0),0);
  // Calculate total cost & profit from sold items
  let totalCost=0;
  active.forEach(o=>{
    if(Array.isArray(o.items))o.items.forEach(it=>{
      const prod=PRODUCTS.find(p=>p.id===it.p);
      if(prod&&prod.cost)totalCost+=parseFloat(prod.cost)*(it.q||1);
    });
  });
  const totalProfit=rev-totalCost;
  const margin=rev>0?Math.round(totalProfit/rev*100):0;
  const margCol=margin>=30?'var(--acid)':margin>=10?'#ffaa00':'var(--red)';
  return `<div class="stats">
    <div class="stat"><div class="l">Revenue</div><div class="n">€<em>${rev.toFixed(0)}</em></div><div class="d">↑ Total sales</div></div>
    <div class="stat" style="border-color:var(--acid)"><div class="l" style="color:var(--acid)">💰 PROFIT</div><div class="n" style="color:${totalProfit>=0?'var(--green)':'var(--red)'}">€<em>${totalProfit.toFixed(0)}</em></div><div class="d" style="color:${margCol}">${margin}% MARGIN</div></div>
    <div class="stat"><div class="l">Cost (paid)</div><div class="n">€<em>${totalCost.toFixed(0)}</em></div><div class="d">Total spent</div></div>
    <div class="stat"><div class="l">Orders</div><div class="n">${ORDERS.length}</div><div class="d">${ORDERS.filter(o=>o.status==='Processing').length} processing</div></div>

    <div class="stat"><div class="l">Customers</div><div class="n">${CUSTOMERS.length}</div><div class="d">Registered</div></div>

function renderSizePicker(forceCat,preselect){
  const cat=forceCat||document.getElementById('pfCat').value;
  if(preselect)pickedSizes=preselect.slice();
  const preset=SIZE_PRESETS[cat]||['One Size'];
  // Include any custom sizes user already had
  const all=[...new Set([...preset,...pickedSizes])];
  const grid=document.getElementById('pfSizesGrid');
  if(!grid)return;
  grid.innerHTML=all.map(s=>`<button type="button" class="pickChip ${pickedSizes.includes(s)?'on':''}" onclick="toggleSize('${s.replace(/'/g,"\\'")}')">${s}</button>`).join('');
  document.getElementById('pfSizesCount').textContent=pickedSizes.length?`(${pickedSizes.length} selected)`:'';
}
function toggleSize(s){
  const i=pickedSizes.indexOf(s);
  if(i>=0)pickedSizes.splice(i,1);else pickedSizes.push(s);
  renderSizePicker();
}
function renderColorPicker(preselect){
  if(preselect)pickedColors=preselect.slice();
  const grid=document.getElementById('pfColorsGrid');
  if(!grid)return;
  // Show preset colors + any custom that admin already has
  const allNames=[...new Set([...COLOR_PRESETS.map(c=>c.name),...pickedColors])];
  grid.innerHTML=allNames.map(name=>{
    const found=COLOR_PRESETS.find(c=>c.name===name);
    const hex=found?found.hex:'#666';
    const on=pickedColors.includes(name);
    return `<button type="button" class="colorChip ${on?'on':''}" onclick="toggleColor('${name.replace(/'/g,"\\'")}')"><span class="swatch" style="background:${hex}"></span>${name}${on?' ✓':''}</button>`;
  }).join('');
  document.getElementById('pfColorsCount').textContent=pickedColors.length?`(${pickedColors.length} selected)`:'';
}
function toggleColor(c){
  const i=pickedColors.indexOf(c);
  if(i>=0)pickedColors.splice(i,1);else pickedColors.push(c);
  renderColorPicker();
}

function closePForm(){document.getElementById('prodFormHost').innerHTML='';editingP=null;pickedSizes=[];pickedColors=[];}

function loadImgSlot(e,i){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  if(f.size>1024*1024){toast('Image #'+(i+1)+' >1MB — use smaller or paste URL');return;}
  const rd=new FileReader();
  rd.onload=ev=>{
    document.getElementById('pfImg'+i).value=ev.target.result;
    updateImgPrev(i);
  };
  rd.readAsDataURL(f);
}
function updateImgPrev(i){
  const v=document.getElementById('pfImg'+i).value;
  const prev=document.getElementById('pfImgPrev'+i);
  if(v){prev.innerHTML=`<img src="${v}"><button type="button" class="imgx" onclick="clearImg(${i})">×</button>`;}
  else{prev.innerHTML=`<span class="imgph">${i===0?'PRIMARY':'#'+(i+1)}</span>`;}
}
function clearImg(i){document.getElementById('pfImg'+i).value='';updateImgPrev(i);}
function updateProfit(){
  const c=parseFloat(document.getElementById('pfCost').value)||0;
  const p=parseFloat(document.getElementById('pfPrice').value)||0;
  const profit=p-c;
  const margin=p>0?(profit/p*100):0;
  const pn=document.getElementById('pfProfitN');const pm=document.getElementById('pfMargin');
  if(pn){pn.textContent='€'+profit.toFixed(2);pn.style.color=profit>=0?'var(--green)':'var(--red)';}
  if(pm){pm.textContent=margin.toFixed(0)+'%';pm.style.color=margin>=30?'var(--acid)':margin>=10?'#ffaa00':'var(--red)';}
}

/* ============ AI AUTO-FILL FROM IMAGE ============ */
async function analyzeWithAI(){
  const img=document.getElementById('pfImg0').value.trim();
  if(!img){toast('Slot #1 me photo upload kar pehle');return;}
  if(!img.startsWith('data:image/')){toast('AI ke liye seedha file upload kar (URL nahi)');return;}
  const btn=document.getElementById('aiAnalyzeBtn');const st=document.getElementById('aiStatus');
  btn.disabled=true;btn.textContent='🤖 AI analyzing… (10-15 sec)';
  st.style.display='block';st.textContent='Sending image to AI…';
  try{
    const resp=await fetch('/api/analyze-product',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:img})
    });
    const txt=await resp.text();
    let data;
    try{data=JSON.parse(txt);}catch(e){throw new Error('Server response invalid: '+txt.slice(0,120));}
    if(!resp.ok||data.error){throw new Error(data.error||'AI failed ('+resp.status+')');}
    // Fill form
    if(data.name)document.getElementById('pfName').value=data.name;
    if(data.brand)document.getElementById('pfBrand').value=data.brand;
    if(data.cat&&document.getElementById('pfCat').querySelector(`option[value="${data.cat}"]`))document.getElementById('pfCat').value=data.cat;
    if(data.g)document.getElementById('pfGen').value=data.g;
    if(data.tag!==undefined)document.getElementById('pfTag').value=data.tag||'';
    if(Array.isArray(data.sizes)&&data.sizes.length)renderSizePicker(data.cat,data.sizes);
    else renderSizePicker(data.cat);
    if(Array.isArray(data.colors)&&data.colors.length)renderColorPicker(data.colors);
    st.style.color='var(--green)';st.textContent='✅ AI filled the form — review & save. Cost/Price tu daal.';
    toast('AI auto-fill done ●');
  }catch(e){
    st.style.color='var(--red)';
    if(e.message.includes('API key')||e.message.includes('not configured'))st.textContent='⚠ Setup needed: ANTHROPIC_API_KEY missing in Vercel env vars. Setup guide diya hai — check chat.';
    else st.textContent='⚠ '+e.message;
    toast('AI failed — see message');
  }finally{
    btn.disabled=false;btn.textContent='🤖 Analyze Photo with AI →';
  }
}

async function saveProduct(e){
  if(e&&e.preventDefault)e.preventDefault();
  const images=[0,1,2,3,4].map(i=>document.getElementById('pfImg'+i).value.trim()).filter(Boolean);
  const sizes=pickedSizes.length?pickedSizes:['One Size'];
  const colors=pickedColors.length?pickedColors:['Black'];
  const p={
    id:editingP.id||'p'+Date.now(),
    name:document.getElementById('pfName').value.trim(),
    brand:document.getElementById('pfBrand').value.trim(),
    cat:document.getElementById('pfCat').value,
    g:document.getElementById('pfGen').value,
    price:parseFloat(document.getElementById('pfPrice').value)||0,
    cost:parseFloat(document.getElementById('pfCost').value)||0,
    tag:document.getElementById('pfTag').value,
    sizes:sizes,
    colors:colors,
    image:images[0]||'',
    images:images
  };
  toast('Saving to live database…');
  const ok=await SB.saveProduct(p);
  if(!ok)return;
  const ex=PRODUCTS.findIndex(x=>x.id===p.id);if(ex>=0)PRODUCTS[ex]=p;else PRODUCTS.push(p);
  adTab('products');toast(ex>=0?'Saved ● Live to customers':'Added ● Live to customers');
}
async function delProduct(id){
  if(!confirm('Delete this piece? This removes it from the live store immediately.'))return;
  const ok=await SB.delProduct(id);
  if(!ok)return;
  PRODUCTS=PRODUCTS.filter(p=>p.id!==id);
  adTab('products');toast('Deleted ●');
}

async function saveSettings(){
  const f=id=>document.getElementById(id)?document.getElementById(id).value.trim():'';
  Object.assign(SITE,{
    brand:f('stBrand'),tagline:f('stTag'),whatsapp:f('stWA'),whatsappDisplay:f('stWAD'),email:f('stEmail'),location:f('stLoc'),
    heroEye:f('stHE'),heroH1:f('stH1'),heroH2:f('stH2'),heroH3:f('stH3'),heroLede:f('stLede'),heroCta1:f('stCta1'),heroCta2:f('stCta2'),
    featuredBrand:f('stFB'),featuredName:f('stFN'),featuredEdition:f('stFE'),featuredId:f('stFID'),
    quoteEye:f('stQE'),quoteText:f('stQT'),vipH:f('stVH'),vipP:f('stVP'),vipBtn:f('stVB'),
    tr1Title:f('stTr1T'),tr1Desc:f('stTr1D'),tr2Title:f('stTr2T'),tr2Desc:f('stTr2D'),
    tr3Title:f('stTr3T'),tr3Desc:f('stTr3D'),tr4Title:f('stTr4T'),tr4Desc:f('stTr4D')
  });
  toast('Saving…');
  const ok=await SB.saveSite(SITE);
  if(ok)toast('Saved ● Live on storefront');
}

/* ============ INIT ============ */
function init(){
  // Bulletproof bindings
  const adForm=document.getElementById('adLoginForm');
  if(adForm){
    adForm.addEventListener('submit',function(e){e.preventDefault();adminLogin(e);return false;});
    const adBtn=adForm.querySelector('button');
    if(adBtn)adBtn.addEventListener('click',function(e){e.preventDefault();adminLogin(e);});
    const pwd=document.getElementById('adPwd');
    if(pwd)pwd.addEventListener('keypress',function(e){if(e.key==='Enter'){e.preventDefault();adminLogin(e);}});
    const otp=document.getElementById('adOtp');
    if(otp)otp.addEventListener('keypress',function(e){if(e.key==='Enter'){e.preventDefault();adminLogin(e);}});
  }
  // Focus password on load
  setTimeout(()=>{const p=document.getElementById('adPwd');if(p)p.focus();},200);
}
window.addEventListener('load',init);
</script>
